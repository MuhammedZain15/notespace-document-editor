name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore project2/project2.csproj
      - run: dotnet build project2/project2.csproj --configuration Release --no-restore
      - run: dotnet test NoteSpace.Tests/NoteSpace.Tests.csproj --configuration Release
